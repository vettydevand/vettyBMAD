<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Studio Veterinario Bianchi - Assistente Virtuale</title>
<style>
  body, html { margin: 0; padding: 0; font-family: sans-serif; background: #f0f0f0; }
  .chat-container { width: 100%; max-width: 500px; margin: 20px auto; border: 1px solid #ccc; background: white; }
  .chat-history { height: 400px; overflow-y: scroll; padding: 10px; border-bottom: 1px solid #ccc; }
  .message-input { display: flex; padding: 10px; }
  .message-input input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
  .message-input button { padding: 8px 12px; margin-left: 10px; background-color: #2c5530; color: white; border: none; border-radius: 5px; cursor: pointer; }
  .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 15px; max-width: 80%; line-height: 1.4; }
  .message.user { background: #dcf8c6; align-self: flex-end; margin-left: auto; }
  .message.vet { background: #e5e5ea; align-self: flex-start; margin-right: auto; }
  .chat-history { display: flex; flex-direction: column; }
</style>
</head>
<body>

<div class="chat-container">
    <div class="chat-history" id="chatHistory"></div>
    <div class="message-input">
        <input type="text" id="messageInput" placeholder="Scrivi un messaggio...">
        <button id="sendButton">Invia</button>
    </div>
</div>

<script>
const API_URL = './test.php'; // Assumendo che sia nella stessa cartella
let clientId = localStorage.getItem('vettyClientId');
if (!clientId) {
    clientId = 'client-' + Date.now() + '-' + Math.random().toString(36).substring(2, 8);
    localStorage.setItem('vettyClientId', clientId);
}

let messagePollInterval;

document.addEventListener('DOMContentLoaded', () => {
    const sendButton = document.getElementById('sendButton');
    const messageInput = document.getElementById('messageInput');

    sendButton.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

    fetchMessages(); // Carica la cronologia all'avvio
    if (messagePollInterval) clearInterval(messagePollInterval);
    messagePollInterval = setInterval(fetchMessages, 5000);
});

async function sendMessage() {
    const messageInput = document.getElementById('messageInput');
    const text = messageInput.value.trim();
    if (!text) return;

    const message = {
        sender: 'user',
        text: text,
        timestamp: new Date().toISOString()
    };

    // Aggiunge immediatamente il messaggio dell'utente all'UI
    addChatMessage(message);
    messageInput.value = '';

    try {
        await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                clientId: clientId,
                details: text,
                dateTime: new Date().toISOString()
            })
        });
    } catch (error) {
        console.error('Error sending message:', error);
        // Qui si potrebbe implementare una logica per indicare che il messaggio non è stato inviato
    }
}

async function fetchMessages() {
    try {
        const response = await fetch(`${API_URL}?action=get_chat_messages&clientId=${clientId}`);
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        const messages = await response.json();
        
        // Svuota e renderizza tutta la cronologia per semplicità.
        // Per ottimizzare, si potrebbe confrontare con i messaggi esistenti.
        const chatHistoryDiv = document.getElementById('chatHistory');
        chatHistoryDiv.innerHTML = '';
        messages.forEach(addChatMessage);

    } catch (error) {
        console.error('Error fetching messages:', error);
    }
}

function addChatMessage(message) {
    const chatHistoryDiv = document.getElementById('chatHistory');
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${message.sender}`;
    messageDiv.textContent = message.text;
    chatHistoryDiv.appendChild(messageDiv);

    // Scrolla fino in fondo
    chatHistoryDiv.scrollTop = chatHistoryDiv.scrollHeight;
}

window.addEventListener('beforeunload', () => {
    if (messagePollInterval) {
        clearInterval(messagePollInterval);
    }
});

</script>
</body>
</html>
