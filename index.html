
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Studio Veterinario Bianchi - Assistente Virtuale</title>
<style>
  body, html { margin: 0; padding: 0; font-family: sans-serif; background: #f0f0f0; }
  .chat-container { width: 100%; max-width: 500px; margin: 20px auto; border: 1px solid #ccc; background: white; display: flex; flex-direction: column; height: calc(100vh - 40px); }
  .chat-history { flex: 1; overflow-y: auto; padding: 10px; border-bottom: 1px solid #ccc; display: flex; flex-direction: column; }
  .message-input { display: flex; padding: 10px; border-top: 1px solid #eee; }
  .message-input input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
  .message-input button { padding: 8px 12px; margin-left: 10px; background-color: #2c5530; color: white; border: none; border-radius: 5px; cursor: pointer; }
  .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 15px; max-width: 80%; line-height: 1.4; }
  .message.user { background: #dcf8c6; align-self: flex-end; margin-left: auto; }
  .message.vet { background: #e5e5ea; align-self: flex-start; margin-right: auto; }
</style>
</head>
<body>

<div class="chat-container">
    <div class="chat-history" id="chatHistory"></div>
    <div class="message-input">
        <input type="text" id="messageInput" placeholder="Scrivi un messaggio...">
        <button id="sendButton">Invia</button>
    </div>
</div>

<script>
/**
 * @fileoverview Logica frontend per l'assistente di chat VettyBMAD.
 */

// === CONFIGURAZIONE ===
const API_URL = 'https://8000-firebase-vettybmad-1758280070941.cluster-lu4mup47g5gm4rtyvhzpwbfadi.cloudworkstations.dev/src/test.php';
let clientId = localStorage.getItem('vettyClientId');
if (!clientId) {
    clientId = 'client-' + Date.now() + '-' + Math.random().toString(36).substring(2, 8);
    localStorage.setItem('vettyClientId', clientId);
}

let lastTimestamp = null;
let messagePollInterval;

document.addEventListener('DOMContentLoaded', () => {
    const sendButton = document.getElementById('sendButton');
    const messageInput = document.getElementById('messageInput');

    sendButton.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    fetchInitialMessages(); 
    
    if (messagePollInterval) clearInterval(messagePollInterval);
    messagePollInterval = setInterval(fetchNewMessages, 5000);
});

async function sendMessage() {
    const messageInput = document.getElementById('messageInput');
    const text = messageInput.value.trim();
    if (!text) return;

    const timestamp = new Date().toISOString();
    const message = { sender: 'user', text: text, timestamp: timestamp };

    addChatMessage(message, true);
    messageInput.value = '';
    lastTimestamp = timestamp;

    try {
        await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                action: 'create_appointment',
                clientId: clientId,
                details: text,
                dateTime: timestamp
            })
        });
    } catch (error) {
        console.error('Errore durante l\'invio del messaggio:', error);
    }
}

async function fetchInitialMessages() {
    try {
        const response = await fetch(`${API_URL}?action=get_chat_messages&clientId=${clientId}`);
        if (!response.ok) throw new Error(`Errore HTTP! stato: ${response.status}`);
        
        const messages = await response.json();
        
        const chatHistoryDiv = document.getElementById('chatHistory');
        chatHistoryDiv.innerHTML = '';
        
        messages.forEach(msg => addChatMessage(msg, false));

        if (messages.length > 0) {
            lastTimestamp = messages[messages.length - 1].timestamp;
        }

        chatHistoryDiv.scrollTop = chatHistoryDiv.scrollHeight;

    } catch (error) {
        console.error('Errore durante il caricamento della cronologia:', error);
    }
}

async function fetchNewMessages() {
    if (!lastTimestamp) return;

    const chatHistoryDiv = document.getElementById('chatHistory');
    const isScrolledToBottom = chatHistoryDiv.scrollHeight - chatHistoryDiv.clientHeight <= chatHistoryDiv.scrollTop + 1;

    try {
        const url = `${API_URL}?action=get_chat_messages&clientId=${clientId}&since=${encodeURIComponent(lastTimestamp)}`;
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Errore HTTP! stato: ${response.status}`);

        const newMessages = await response.json();

        if (newMessages.length > 0) {
            newMessages.forEach(msg => addChatMessage(msg, false));
            lastTimestamp = newMessages[newMessages.length - 1].timestamp;

            if (isScrolledToBottom) {
                chatHistoryDiv.scrollTop = chatHistoryDiv.scrollHeight;
            }
        }
    } catch (error) {
        console.error('Errore durante il recupero dei nuovi messaggi:', error);
    }
}

function addChatMessage(message, forceScroll = false) {
    const chatHistoryDiv = document.getElementById('chatHistory');
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${message.sender}`;
    messageDiv.textContent = message.text;
    
    chatHistoryDiv.appendChild(messageDiv);

    if (forceScroll) {
        chatHistoryDiv.scrollTop = chatHistoryDiv.scrollHeight;
    }
}

window.addEventListener('beforeunload', () => {
    if (messagePollInterval) {
        clearInterval(messagePollInterval);
    }
});

</script>
</body>
</html>
